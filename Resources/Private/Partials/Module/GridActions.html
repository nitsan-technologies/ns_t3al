<html
	xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
	data-namespace-typo3-fluid="true">

<div class="ns-t3al-grid-actions">
	<f:if condition="{modifyKeys}">
		<div class="ns-t3al-import-csv input-group">
			<input type="file"
				class="form-control"
				name="importFile"
				form="translate_import"
				accept=".csv,.txt"
				aria-label="{f:translate(key:'LLL:EXT:ns_t3al/Resources/Private/Language/locallang_mod.xlf:csv.import')}" />
			<button type="submit"
				class="btn btn-default"
				form="translate_import">
				<f:translate key="LLL:EXT:ns_t3al/Resources/Private/Language/locallang_mod.xlf:csv.import" />
			</button>
		</div>
	</f:if>
	<f:if condition="{sourceEditable}">
		<f:link.action
			action="list"
			arguments="{extensionKey:extkey,file:file,langKeys:langKeys,sort:1}"
			class="btn btn-default ns-t3al-sort-by-key">
			<f:translate key="LLL:EXT:ns_t3al/Resources/Private/Language/locallang_mod.xlf:sort_by_key" />
		</f:link.action>
	</f:if>
	<div class="ns-t3al-grid-actions__end">
		<f:render partial="Module/EditorActions" section="Main" arguments="{_all}" />
		<f:render partial="Module/EditorActions" section="Export" arguments="{_all}" />
	</div>
</div>
</html>
