stages:
  - ci

default:
  interruptible: true

variables:
  COMPOSER_HOME: "${CI_PROJECT_DIR}/.composer"
  COMPOSER_CACHE_DIR: "${CI_PROJECT_DIR}/.composer/cache"
  COMPOSER_ALLOW_SUPERUSER: "1"
  TYPO3_SKIP_ASSET_PUBLISH: "1"
  PHP_INI_MEMORY_LIMIT: "1G"
  PHP_CI_IMAGE: "himanshuramavat/php-ci"
  PHP_CI_VERSION: "1.5.0"

# Pins the TYPO3 packages ns_t3al requires to the job's TYPO3_VERSION and installs the dev tools.
.composer_setup: &composer_setup
  - php -v
  - php -m | grep -iE 'intl|mbstring|dom|zip' || true
  - composer --version
  - rm -rf .Build/vendor .Build/bin composer.lock
  - composer require --no-update --no-interaction
      "typo3/cms-core:${TYPO3_VERSION}"
      "typo3/cms-backend:${TYPO3_VERSION}"
      "typo3/cms-extbase:${TYPO3_VERSION}"
      "typo3/cms-extensionmanager:${TYPO3_VERSION}"
      "typo3/cms-fluid:${TYPO3_VERSION}"
  - composer update --no-interaction --prefer-dist --no-progress

# ── Tests ────────────────────────────────────────────────────────────────────
# Unit tests only (no functional tests). TYPO3 12 supports PHP 8.1, TYPO3 13 / 14 need 8.2+.

tests:
  stage: ci
  needs: []
  image: ${PHP_CI_IMAGE}:${PHP_VERSION}-v${PHP_CI_VERSION}
  parallel:
    matrix:
      - TYPO3_VERSION: "^12.4"
        PHP_VERSION: ["8.1", "8.2", "8.3", "8.4"]
      - TYPO3_VERSION: "^13.4"
        PHP_VERSION: ["8.2", "8.3", "8.4"]
      - TYPO3_VERSION: "^14.3"
        PHP_VERSION: ["8.2", "8.3", "8.4"]
  cache:
    key: "composer-php${PHP_VERSION}-typo3${TYPO3_VERSION}"
    paths:
      - .composer/cache/
  before_script:
    - *composer_setup
  script:
    - .Build/bin/phpunit -c Build/phpunit/UnitTests.xml
  rules:
    - if: $CI_PIPELINE_SOURCE == "web"
    - changes:
        - "Classes/**/*"
        - "Configuration/**/*"
        - "Tests/**/*"
        - "Build/**/*"
        - "composer.json"
        - "ext_emconf.php"
        - "ext_conf_template.txt"
        - ".gitlab-ci.yml"

# ── Lint (parse check) ────────────────────────────────────────────────────────
# Pure `php -l`: needs PHP only, no composer install / no TYPO3.
# 8.1 is the lowest supported PHP (catches newer syntax), 8.4 the newest image.

lint:
  stage: ci
  needs: []
  image: ${PHP_CI_IMAGE}:${PHP_VERSION}-v${PHP_CI_VERSION}
  parallel:
    matrix:
      - PHP_VERSION: ["8.1", "8.4"]
  script:
    - find Classes Configuration Tests ext_emconf.php ext_localconf.php -name "*.php" -print0 | xargs -0 -n1 -P8 php -l
  rules:
    - if: $CI_PIPELINE_SOURCE == "web"
    - changes:
        - "Classes/**/*"
        - "Configuration/**/*"
        - "Tests/**/*"
        - "ext_emconf.php"
        - "ext_localconf.php"
        - ".gitlab-ci.yml"

# ── Coding standards ──────────────────────────────────────────────────────────
# php-cs-fixer only; installed globally so we skip the full TYPO3 dependency tree.

cs:
  stage: ci
  needs: []
  image: ${PHP_CI_IMAGE}:8.2-v${PHP_CI_VERSION}
  cache:
    key: cs-tools
    paths:
      - .composer/cache/
  script:
    - composer global require --no-progress "friendsofphp/php-cs-fixer:^3.94"
    - PATH="$(composer global config home)/vendor/bin:$PATH"
    - php-cs-fixer fix --dry-run --diff
  rules:
    - if: $CI_PIPELINE_SOURCE == "web"
    - changes:
        - "Classes/**/*"
        - "Configuration/**/*"
        - "Tests/**/*"
        - "ext_emconf.php"
        - "ext_localconf.php"
        - ".php-cs-fixer.php"
        - ".gitlab-ci.yml"

# ── Static analysis ───────────────────────────────────────────────────────────
# PHPStan needs the real dependency tree. One job per TYPO3 major: the code branches on
# APIs that exist in only some majors (e.g. LanguagePackService in EXT:install vs. EXT:core).

stan:
  stage: ci
  needs: []
  image: ${PHP_CI_IMAGE}:${PHP_VERSION}-v${PHP_CI_VERSION}
  parallel:
    matrix:
      - TYPO3_VERSION: "^12.4"
        PHP_VERSION: "8.1"
      - TYPO3_VERSION: "^13.4"
        PHP_VERSION: "8.2"
      - TYPO3_VERSION: "^14.3"
        PHP_VERSION: "8.2"
  cache:
    key: "composer-php${PHP_VERSION}-typo3${TYPO3_VERSION}"
    paths:
      - .composer/cache/
  before_script:
    - *composer_setup
  script:
    - composer stan
  rules:
    - if: $CI_PIPELINE_SOURCE == "web"
    - changes:
        - "Classes/**/*"
        - "Configuration/**/*"
        - "Tests/**/*"
        - "Build/**/*"
        - "composer.json"
        - "ext_localconf.php"
        - "phpstan.neon"
        - ".gitlab-ci.yml"
