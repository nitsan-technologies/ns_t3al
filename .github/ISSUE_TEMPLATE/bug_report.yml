name: Bug Report
description: Report a bug or unexpected behavior
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug in AI-Powered XLIFF Translation (`ns_t3al`)!

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear description of what the bug is
      placeholder: Describe what happened...
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior
      placeholder: |
        1. Open Admin Tools → AI Localization
        2. Select extension '...' and file '...'
        3. Click '...'
        4. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What you expected to happen
    validations:
      required: true

  - type: input
    id: t3al-version
    attributes:
      label: ns_t3al Version
      placeholder: "1.0.0"
    validations:
      required: true

  - type: input
    id: typo3-version
    attributes:
      label: TYPO3 Version
      placeholder: "13.4.0"
    validations:
      required: true

  - type: input
    id: php-version
    attributes:
      label: PHP Version
      placeholder: "8.2.0"
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Translation grid (edit / save)
        - AI translation
        - Crowdin upload
        - CSV import / export, ZIP export
        - Search
        - Translation logs
        - Access / permissions
        - Extension configuration
        - Other
    validations:
      required: false

  - type: dropdown
    id: provider
    attributes:
      label: Translation Provider (if relevant)
      options:
        - OpenAI
        - Google Gemini
        - DeepL
        - Google Translate
        - N/A
    validations:
      required: false
